name: Convert existing reviewed node compilation cache without recompiling
on:
  workflow_call:
    inputs:
      target_environment:
        type: string
        required: true
    secrets:
      TOKEN_ACTION:
        required: false
permissions:
  contents: read
  actions: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pool: ${{ steps.scope.outputs.pool }}
    steps:
      - id: scope
        env:
          TARGET: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = matrixorigin/matrixone
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/weilu-runner-test
          test "$GITHUB_ACTOR" = Ariznawlll
          test "$GITHUB_RUN_ATTEMPT" = 1
          case "$TARGET" in
            mty|jed) pool="cs-$TARGET-pvc-g0-cpe8k" ;;
            ruh) pool=cs-ruh-pvc-g0-rhprep ;;
            mnl2) pool=cs-mnl2-pvc-g0-vlleop ;;
            *) exit 1 ;;
          esac
          echo "pool=$pool" >> "$GITHUB_OUTPUT"
  migrate:
    needs: authorize
    runs-on: ${{ needs.authorize.outputs.pool }}
    environment: ci
    timeout-minutes: 45
    steps:
      - name: Install same runner build dependencies without compiling source
        timeout-minutes: 10
        run: |
          set -euo pipefail
          if command -v gcc && command -v g++ && command -v make && command -v pkg-config && command -v cmake && command -v python; then
            echo 'Build dependencies are already available.'
          else
            sudo apt-get -o Acquire::ForceIPv4=true update
            sudo apt-get -o Acquire::ForceIPv4=true install -y build-essential cmake pkg-config python3 python-is-python3
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/matrixone
          ref: dbc7ca14ca8b01cfe6d9e9a151619ea4b5ba14ca
          token: ${{ secrets.TOKEN_ACTION }}
          persist-credentials: false
          fetch-depth: 1
      - uses: matrixorigin/CI/actions/setup-env@4670989748419fb169f88282cf05fb690ea91074
        with:
          setup-java: false
          go-version-file: "${{ github.workspace }}/go.mod"
          cache: false
      - uses: matrixorigin/CI/actions/setup-python-udf@4670989748419fb169f88282cf05fb690ea91074
        if: ${{ hashFiles('pkg/udf/python/worker/requirements.txt') != '' }}
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .ci-workflow
          token: ${{ secrets.TOKEN_ACTION }}
          persist-credentials: false
      - name: Convert authenticated compile-only bytes from read-only PVC
        timeout-minutes: 25
        env:
          CS_CACHE_ENV: ${{ inputs.target_environment }}
          CS_CACHE_READ_TOKEN: ${{ github.token }}
          COVERAGE_GROUP: '0'
          GOFLAGS: ''
          GOWORK: 'off'
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          export GOMODCACHE="$RUNNER_TEMP/cs-buildcache-gomod"
          export GOCACHE="$RUNNER_TEMP/cs-buildcache-go"
          python3 .ci-workflow/scripts/node_cache_migration_job.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 15
        with:
          name: node-cache-migration-${{ inputs.target_environment }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/node-cache-migration-bundle/index.json
            ${{ runner.temp }}/node-cache-migration-bundle/manifest.json
            ${{ runner.temp }}/node-cache-migration-bundle/delta.tar.gz
          if-no-files-found: error
          retention-days: 7
