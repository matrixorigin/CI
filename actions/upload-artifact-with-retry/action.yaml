name: Upload artifact with retry
description: Retry transient GitHub artifact-service failures without rerunning producer work.

inputs:
  name:
    description: Artifact name owned by one job within the workflow run; retries overwrite this name.
    required: true
  path:
    description: File, directory, or multiline path specification to upload.
    required: true
  if-no-files-found:
    description: Behavior when no input files exist.
    required: false
    default: error
  retention-days:
    description: Number of days to retain the artifact.
    required: false
    default: "7"
  overwrite:
    description: Delete an existing same-name artifact before the first attempt.
    required: false
    default: "false"
  compression-level:
    description: Zlib compression level passed to actions/upload-artifact.
    required: false
    default: "6"

runs:
  using: composite
  steps:
    - name: Upload artifact (attempt 1/3)
      id: upload_1
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: ${{ inputs.overwrite }}
        compression-level: ${{ inputs.compression-level }}

    - name: Back off before artifact upload retry 1
      if: ${{ always() && !cancelled() && steps.upload_1.outcome == 'failure' }}
      shell: bash
      run: sleep 5

    - name: Upload artifact (attempt 2/3)
      id: upload_2
      if: ${{ always() && !cancelled() && steps.upload_1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        # A failed finalize response is ambiguous: delete any partial or
        # already-finalized generation before publishing the retry.
        overwrite: true

    - name: Back off before artifact upload retry 2
      if: ${{ always() && !cancelled() && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure' }}
      shell: bash
      run: sleep 15

    - name: Upload artifact (attempt 3/3)
      if: ${{ always() && !cancelled() && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true
