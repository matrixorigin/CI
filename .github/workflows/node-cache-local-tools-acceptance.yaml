        if-no-files-found: ignore
        retention-days: 7
  merge-coverage-groups:
    needs:
    - ut-coverage-linux-x86
    if: ${{ needs.ut-coverage-linux-x86.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: matrixorigin/CI
        ref: fda89a9c2b6b51b72ec5d912d80ce0ecef256e51
        token: ${{ secrets.TOKEN_ACTION }}
        persist-credentials: false
        sparse-checkout: 'scripts/coverage_group_collect.py

          scripts/coverage_two_groups_merge.py

          scripts/compact_coverage_profile.go

          '
        sparse-checkout-cone-mode: false
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: false
    - uses: actions/download-artifact@v4
      with:
        pattern: ut-coverage-skips-group-*-${{ github.run_id }}-*
        path: raw/groups
    - uses: actions/download-artifact@v4
      with:
        pattern: ut-coverage-group-*-generation-${{ github.run_id }}-*
        path: raw/profiles
    - name: Validate complete package evidence and merge profiles
      env:
        EXPECTED_HEAD_SHA: ${{ inputs.source_sha }}
        GROUP_COUNT: ${{ inputs.group_count }}
      run: "set -euo pipefail\ntest -n \"$EXPECTED_HEAD_SHA\"\npython3 scripts/coverage_group_collect.py --groups raw/groups --profiles\
        \ raw/profiles --output selected --run-id \"$GITHUB_RUN_ID\" --group-count \"$GROUP_COUNT\"\npython3 scripts/coverage_two_groups_merge.py\
        \ selected/groups combined-skip-manifest.json --expected-sha \"$EXPECTED_HEAD_SHA\" --group-count \"$GROUP_COUNT\"\nfor ((group=0;group<GROUP_COUNT;group++));\
        \ do\n  test \"$(head -n 1 \"selected/profiles/$group/ut-coverage.out\")\" = 'mode: set'\n  if [ \"$group\" = 0 ]; then\n  \
        \  cat \"selected/profiles/$group/ut-coverage.out\" > \"$RUNNER_TEMP/ut-coverage.out\"\n  else\n    tail -n +2 \"selected/profiles/$group/ut-coverage.out\"\
        \ >> \"$RUNNER_TEMP/ut-coverage.out\"\n  fi\ndone\ngo run scripts/compact_coverage_profile.go \"$RUNNER_TEMP/ut-coverage.out\"\
        \n"
    - name: Upload combined UT coverage for existing consumer
      uses: matrixorigin/CI/actions/upload-artifact-with-retry@main
      with:
        name: ut-coverage-generation-${{ inputs.bvt_generation || format('{0}-{1}', github.run_id, github.run_attempt) }}-attempt-${{
          github.run_attempt }}
        path: ${{ runner.temp }}/ut-coverage.out
        if-no-files-found: error
        retention-days: 7
    - name: Upload combined skip evidence
      uses: actions/upload-artifact@v7
      with:
        name: ut-coverage-combined-skips-${{ github.run_id }}-${{ github.run_attempt }}
        path: combined-skip-manifest.json
        if-no-files-found: error
        retention-days: 7
  coverage-final-status:
    needs:
    - check_coverage_eligibility
    - ut-coverage-linux-x86
    - merge-coverage-groups
    if: ${{ always() && !cancelled() && needs.check_coverage_eligibility.outputs.allowed == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.result.outputs.status }}
    steps:
    - id: result
      env:
        GROUP_RESULT: ${{ needs.ut-coverage-linux-x86.result }}
        MERGE_RESULT: ${{ needs.merge-coverage-groups.result }}
      run: "if [ \"$GROUP_RESULT\" = success ] && [ \"$MERGE_RESULT\" = success ]; then\n  echo 'status=passed' >> \"$GITHUB_OUTPUT\"\
        \nelse\n  echo 'status=failed' >> \"$GITHUB_OUTPUT\"\nfi\n"
'on':
  workflow_call:
    inputs:
      cache_seed:
        description: Compatibility input; CS three-group workflow does not seed external caches
        required: false
        type: boolean
        default: false
      coverage_compile_cache:
        description: Reuse an exact-version reviewed compile-only artifact; never create a seed on a cache miss
        required: false
        type: boolean
        default: false
      node_compile_cache:
        description: Opt in to reviewed incremental objects on isolated node-cache pools; never publishes from a test job
        required: false
        type: boolean
        default: true
      node_cache_environment:
        description: Environment for the isolated node-cache routing label (mty, mnl2, jed, ruh)
        required: true
        type: string
      node_cache_candidate:
        description: Must be false; consumer never exports or publishes cache
        required: false
        type: boolean
        default: false
      bvt_generation:
        description: Shared CI generation used to select this run's coverage artifacts
        required: false
        type: string
        default: ''
      source_sha:
        type: string
        required: true
        description: Explicit reviewed test source SHA, never a moving branch
      group_count:
        type: number
        required: true
        description: Two or three complete groups; no package exclusions
    outputs:
      coverage_ready:
        description: Whether the UT coverage profile was eligible to run
        value: ${{ jobs.check_coverage_eligibility.outputs.allowed }}
      coverage_status:
        description: Terminal UT coverage producer status
        value: ${{ jobs['coverage-final-status'].outputs.status }}
    secrets:
      CS_COVERAGE_CACHE_READ_TOKEN:
        description: Optional repository Actions-read-only token; otherwise use the caller GITHUB_TOKEN
        required: false
      CS_S3_MTY_CONFIG:
        required: false
      CS_S3_MNL2_CONFIG:
        required: false
      CS_S3_JED_CONFIG:
        required: false
      CS_S3_RUH_CONFIG:
        required: false
      TOKEN_ACTION:
        description: Token for checkout (e.g. pull from fork/private)
        required: false
