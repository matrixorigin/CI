      timeout-minutes: 5
      run: "set -euo pipefail\npython3 .ci-workflow/scripts/node_compile_cache.py accept --state \"$RUNNER_TEMP/cs-node-cache/state.json\"\
        \npython3 .ci-workflow/scripts/node_cache_validation.py \\\n  --policy .ci-workflow/config/node-cache-validation-sources.json\
        \ \\\n  --state \"$RUNNER_TEMP/cs-node-cache/state.json\" \\\n  --source \"$GITHUB_WORKSPACE\" \\\n  --packages \"$RUNNER_TEMP/coverage-group.txt\"\
        \ \\\n  --report \"$RUNNER_TEMP/ut-coverage-report.json\" \\\n  --output \"$RUNNER_TEMP/cs-node-cache/validation.json\"\n"
    - id: upload_node_cache_failures
      name: Upload sanitized incremental failure evidence
      if: ${{ always() && !cancelled() && inputs.node_compile_cache }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: node-cache-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
        path: '${{ runner.temp }}/cs-node-cache/failure-reports/*.json

          ${{ runner.temp }}/cs-node-cache/objects-private/failure-reports/*.json

          '
        if-no-files-found: ignore
        retention-days: 7
    - id: coverage_status
      name: Record final UT coverage producer status
      if: ${{ always() && !cancelled() }}
      timeout-minutes: 5
      continue-on-error: true
      run: "set -euo pipefail\nstatus_file=\"${RUNNER_TEMP}/ut-coverage-status.json\"\nif [ -s \"${status_file}\" ]; then\n  result=$(jq\
        \ -r '.result // \"unknown\"' \"${status_file}\")\n  reason=$(jq -r '.reason // \"unknown\"' \"${status_file}\")\n  if [ \"\
        ${{ steps.coverage_ut.outcome }}\" = 'failure' ] && [ \"${result}\" = 'passed' ]; then\n    result=failed\n    reason=post_test_phase_failure\n\
        \  fi\nelif [ -s \"${RUNNER_TEMP}/ut-coverage-timeout.txt\" ]; then\n  result=timeout\n  reason=coverage_phase_deadline\nelif\
        \ [ -s \"${RUNNER_TEMP}/ut-coverage-phase-failure.txt\" ]; then\n  result=failed\n  reason=coverage_phase_failure\nelif [ -s\
        \ \"${RUNNER_TEMP}/ut-coverage-phase-timing.txt\" ] && \\\n  awk '$2 ~ /^status=[1-9]/ { found=1; exit } END { exit !found }'\
        \ \"${RUNNER_TEMP}/ut-coverage-phase-timing.txt\"; then\n  result=failed\n  reason=coverage_preparation_or_compaction_failure\n\
        elif [ \"${{ steps.coverage_ut.outcome }}\" = 'success' ]; then\n  result=passed\n  reason=command_exit\nelif [ \"${{ steps.coverage_ut.outcome\
        \ }}\" = 'failure' ]; then\n  result=failed\n  reason=coverage_step_terminated_without_status\nelse\n  result=external_timeout_or_cancellation\n\
        \  reason=producer_status_file_missing\nfi\nif [ \"${result}\" = 'passed' ] && [ \"${{ steps.upload_coverage_profile.outcome\
        \ }}\" != 'success' ]; then\n  result=failed\n  reason=coverage_profile_artifact_upload_failure\nfi\nif [ '${{ inputs.node_compile_cache\
        \ }}' = true ] && [ '${{ steps.node_cache_acceptance.outcome }}' != success ]; then\n  result=failed\n  reason=incremental_cache_validation_failure\n\
        fi\nstatus_tmp=\"${status_file}.final\"\nif [ -s \"${status_file}\" ]; then\n  jq --arg result \"${result}\" --arg reason \"\
        ${reason}\" \\\n    '. + {result: $result, reason: $reason}' \"${status_file}\" > \"${status_tmp}\"\nelse\n  jq -n --arg result\
        \ \"${result}\" --arg reason \"${reason}\" \\\n    '{result: $result, reason: $reason}' > \"${status_tmp}\"\nfi\nmv \"${status_tmp}\"\
        \ \"${status_file}\"\necho \"status=${result}\" >> \"$GITHUB_OUTPUT\"\necho \"- UT coverage producer status: \\`${result}\\\
        ` (reason: \\`${reason}\\`).\" >> \"$GITHUB_STEP_SUMMARY\"\n"
    - id: render_coverage_report
      name: Render readable coverage UT report
      if: ${{ always() && !cancelled() }}
      timeout-minutes: 5
      continue-on-error: true
      run: "set -uo pipefail\nreport=\"${RUNNER_TEMP}/ut-coverage-report.json\"\nincident=\"${RUNNER_TEMP}/ut-coverage-incident.md\"\
        \npython \"$GITHUB_WORKSPACE/.ci-workflow/scripts/summarize_coverage_ut.py\" \\\n  --report \"${report}\" \\\n  --status \"\
