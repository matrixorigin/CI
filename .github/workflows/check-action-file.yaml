name: Check Yaml

on:
  pull_request:
    branches:
      - main
      - 'release/*'
    paths:
      - '.github/workflows/*.yaml'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  validate-github-actions-workflows:
    name: Validate GitHub Actions workflows
    permissions:
      contents: read
    runs-on: arm64-mo-shanghai-4c8g
    steps:
      - uses: actions/checkout@v6
      - name: Check for any changed workflows
        id: check-for-changed-workflows
        uses: tj-actions/changed-files@v47
        with:
          files: |
            .github/workflows/**.yaml
            scripts/**
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install coverage test dependencies
        run: python -m pip install --disable-pip-version-check --no-input pytest
      - name: Check coverage shell syntax
        run: bash -n scripts/*.sh
      - name: Run coverage helper and parser tests
        run: python -m pytest -q scripts/test_run_coverage_ut.py scripts/test_parse_coverage.py scripts/test_prepare_coverage_cgo.py
      - name: Validate workflows
        if: steps.check-for-changed-workflows.outputs.any_changed == 'true'
        uses: dsanders11/json-schema-validate-action@v2.0.0
        with:
          schema: https://json.schemastore.org/github-workflow.json
          files: .github/workflows/**.yaml 
