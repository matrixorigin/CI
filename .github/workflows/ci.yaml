# Define workflow name.
name: MatrixOne CI

on:
  workflow_call:
    inputs:
      ut_parallel:
        description: "Maximum number of UT packages built and tested concurrently"
        required: false
        type: number
        default: 6
      ut_sharded:
        description: "Run the complete race UT suite as four disjoint parallel shards"
        required: false
        type: boolean
        default: false
    secrets:
      TOKEN_ACTION:
        description: "Token for checkout (e.g. pull from fork/private)"
        required: false
      S3ENDPOINT:
        description: "S3ENDPOINT For Test"
        required: true
      S3REGION:
        description: "S3REGION For Test"
        required: true
      S3APIKEY:
        description: "S3APIKEY For Test"
        required: true
      S3APISECRET:
        description: "S3APISECRET For Test"
        required: true
      S3BUCKET:
        description: "S3BUCKET For Test"
        required: true
      EE_DB_ADDR:
        description: "matrixone cloud host"
        required: true
      EE_DB_PORT:
        description: "matrixone cloud port"
        required: true
      EE_DB_USER:
        description: "matrixone cloud user"
        required: true
      EE_DB_PASSWORD:
        description: "matrixone cloud password"
        required: true
      EE_DB_DB:
        description: "matrixone cloud db"
        required: true

jobs:
  ut-linux-x86-shard:
    strategy:
      fail-fast: false
      # Bound runner fan-out even if the shard list evolves later.
      max-parallel: 4
      matrix:
        ut_shard: ${{ fromJSON(inputs.ut_sharded && '["light","issues","embedded","heavy-plan"]' || '["all"]') }}
    environment: ci
    runs-on: ${{ vars.UT_RUNNER_LABEL || 'ubuntu-22.04' }}
    # Preserve the existing check and execution path for every caller that has
    # not opted into sharding. In sharded mode only the summary job below owns
    # the established required-check name.
    name: ${{ inputs.ut_sharded && format('UT Test shard {0} on Ubuntu/x86', matrix.ut_shard) || 'UT Test on Ubuntu/x86' }}
    steps:
      - name: Pre Clean Some Unneeded Images
        run: |
          echo "===== disk before clean ====="
          sudo df -h /
          sudo df -h /mnt || true
          echo "========================================="
          # Free space on GitHub-hosted root disk (preinstalled toolchains)
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo docker builder prune -f -a || true
          sudo docker images | grep -v REPOSITORY | awk '{system("sudo docker rmi "$1":"$2)}' || true
          sudo docker volume prune -f || true
          sudo docker system prune -af || true
          echo "========================================="
          # Redirect TAE UT workspace (/tmp/runner-ut-workspace) to /mnt which has more free space
          if [ -d /mnt ]; then
            sudo mkdir -p /mnt/runner-ut-workspace
            sudo chmod 777 /mnt/runner-ut-workspace
            sudo rm -rf /tmp/runner-ut-workspace
            sudo ln -sfn /mnt/runner-ut-workspace /tmp/runner-ut-workspace
            ls -ld /tmp/runner-ut-workspace
          fi
          echo "===== disk after clean ====="
          sudo df -h /
          sudo df -h /mnt || true
          df -h /tmp

      - name: Parse Time for moc
        id: time
        run: |
          export TZ='Asia/Shanghai'

          #utcTime="2024-11-15T08:33:52Z"
          action_time=${{ github.event.pull_request.head.repo.pushed_at }}
          ACTION_TIME=$(date -d "${action_time}" '+%Y-%m-%d %H:%M:%S')

          # 获取格式化的日期时间字符串
          time=$(date '+%Y-%m-%d %H:%M:%S')

          # action link
          action_link="https://github.com/${{ github.event.pull_request.base.repo.full_name }}/actions/runs/${{ github.run_id }}"

          echo "ACTION_TIME=${ACTION_TIME}"
          echo "START_TIME=${time}"
          echo "ACTION_LINK=${action_link}"

          echo "ACTION_TIME=${ACTION_TIME}" >> $GITHUB_OUTPUT
          echo "START_TIME=${time}" >> $GITHUB_OUTPUT
          echo "ACTION_LINK=${action_link}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          fetch-depth: "3"
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # Every matrix child must test the immutable commit that triggered
          # this run. A mutable branch ref can move while sibling shards queue,
          # producing one green check from tests of different revisions.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          setup-java: true
          go-version-file: "${{ github.workspace }}/go.mod"
      - name: Set env
        run: |
          echo "endpoint=${{ secrets.S3ENDPOINT }}" >> $GITHUB_ENV
          echo "region=${{ secrets.S3REGION }}" >> $GITHUB_ENV
          echo "apikey=${{ secrets.S3APIKEY }}" >> $GITHUB_ENV
          echo "apisecret=${{ secrets.S3APISECRET }}" >> $GITHUB_ENV
          echo "bucket=${{ secrets.S3BUCKET }}" >> $GITHUB_ENV
          # set ut workdir
          echo "UT_WORKDIR=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Configure Shanghai Go proxy
        if: ${{ contains(vars.UT_RUNNER_LABEL, 'shanghai') }}
        env:
          SHANGHAI_GOPROXY: http://goproxy.goproxy.svc.cluster.local|https://goproxy.cn|direct
        run: |
          set -euo pipefail

          echo "Runner: ${{ runner.name }}"
          echo "Runner OS: ${{ runner.os }}"

          proxy_url="${SHANGHAI_GOPROXY%%|*}"
          proxy_host="${proxy_url#*://}"
          probe_module="github.com/spf13/cobra"
          probe_version="$(
            awk -v module="$probe_module" '
              $1 == module { print $2; exit }
              $1 == "require" && $2 == module { print $3; exit }
            ' go.mod 2>/dev/null || true
          )"
          proxy_status=""
          proxy_enabled="false"
          probe_result="not-attempted"

          if [[ -z "$probe_version" ]]; then
            probe_result="module-not-found-in-go.mod"
          elif ! timeout 20s getent hosts "$proxy_host"; then
            probe_result="dns-failed-or-timed-out"
          elif proxy_status="$(curl \
              --silent \
              --show-error \
              --connect-timeout 5 \
              --max-time 30 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "${proxy_url}/${probe_module}/@v/${probe_version}.info")" && \
            [[ "$proxy_status" == "200" ]]; then
            proxy_enabled="true"
            probe_result="module-http-200"
            echo "Shanghai internal GOPROXY served ${probe_module}@${probe_version}"
            echo "Using GOPROXY=${SHANGHAI_GOPROXY}"
            echo "GOPROXY=${SHANGHAI_GOPROXY}" >> "$GITHUB_ENV"
          else
            probe_result="module-http-${proxy_status:-unavailable}"
          fi

          if [[ "$proxy_enabled" != "true" ]]; then
            echo "::warning::Shanghai internal GOPROXY probe failed (${probe_result}); leaving GOPROXY unchanged"
          fi
      # Best-effort: seed the Go build/module caches and the prebuilt C
      # thirdparties from the nightly ci-builder image (see
      # optools/images/Dockerfile.ci-builder in matrixone). The image warms
      # the exact race+matrixone_test flavor run_ut.sh compiles, so only
      # packages the PR changed (plus the few path-keyed cgo packages)
      # recompile. Any failure here just leaves the job building cold.
      - name: Seed Go caches from CI builder image
        continue-on-error: true
        run: |
          set -euo pipefail
          command -v docker >/dev/null || { echo "docker unavailable; skipping seed"; exit 0; }
          gocache=$(go env GOCACHE)
          gomodcache=$(go env GOMODCACHE)
          mkdir -p "${gocache}" "${gomodcache}"
          # Persistent runners arrive warm: skip the pull entirely.
          if [ -n "$(ls -A "${gocache}")" ]; then
            echo "Go build cache already populated; skipping seed"
            exit 0
          fi
          # The image plus the extracted caches peak around ~26GB; on a
          # disk-constrained runner a cold build (today's behavior) is
          # strictly safer than an ENOSPC mid-job.
          avail_kb=$(df -Pk "${HOME}" | awk 'NR==2 {print $4}')
          if [ "${avail_kb}" -lt 31457280 ]; then
            echo "only $((avail_kb / 1024 / 1024))GB free; skipping cache seed"
            exit 0
          fi
          ACR_IMAGE="registry.cn-shanghai.aliyuncs.com/matrixorigin/matrixone:ci-builder"
          HUB_IMAGE="matrixorigin/matrixone:ci-builder"
          # ANONYMOUS pulls on purpose: this job later executes PR-controlled
          # code, so no registry credential may ever touch this runner. Route
          # by runner locality (GitHub-hosted reaches Docker Hub fast, the
          # self-hosted China pools reach ACR fast); each attempt is time-
          # bounded, and layers are content-addressed so a timed-out first
          # attempt still counts toward the second.
          if [ "${RUNNER_ENVIRONMENT:-}" = "github-hosted" ]; then
            first="${HUB_IMAGE}"; second="${ACR_IMAGE}"
          else
            first="${ACR_IMAGE}"; second="${HUB_IMAGE}"
          fi
          image=""
          if timeout 300 docker pull "${first}"; then
            image="${first}"
          elif timeout 300 docker pull "${second}"; then
            image="${second}"
          fi
          if [ -z "${image}" ]; then
            echo "ci-builder image unreachable; skipping seed"
            docker system prune -f >/dev/null 2>&1 || true
            exit 0
          fi
          ctr=$(docker create "${image}")
          gocache_stage="${gocache}.seed-stage"
          gomodcache_stage="${gomodcache}.seed-stage"
          trap 'docker rm -f "${ctr}" >/dev/null 2>&1; rm -rf "${gocache_stage}" "${gomodcache_stage}"' EXIT
          # Surface the nightly warm health recorded by the builder image
          # (absent on images that predate it).
          docker cp "${ctr}:/mo-prebuilt/warm-status" - 2>/dev/null | tar -xO 2>/dev/null || true
          # Extract into same-filesystem staging dirs and rename into place
          # only when complete: a mid-stream failure must never leave a
          # half-populated cache that this or a later run mistakes for warm.
          rm -rf "${gocache_stage}" "${gomodcache_stage}"
          mkdir -p "${gocache_stage}" "${gomodcache_stage}"
          docker cp "${ctr}:/root/.cache/go-build/." "${gocache_stage}/"
          # tar stream instead of a plain copy: the module cache may carry
          # read-only directories, which docker cp cannot populate.
          docker cp "${ctr}:/go/pkg/mod" - | tar -x --no-same-permissions --strip-components=1 -C "${gomodcache_stage}"
          rmdir "${gocache}" && mv "${gocache_stage}" "${gocache}"
          if [ -z "$(ls -A "${gomodcache}")" ]; then
            rmdir "${gomodcache}" && mv "${gomodcache_stage}" "${gomodcache}"
          fi
          # Free the image before the job's real work needs the disk.
          docker rm -f "${ctr}" >/dev/null 2>&1 || true
          docker rmi "${image}" >/dev/null 2>&1 || true
          # Host jobs deliberately seed Go caches ONLY: the Go build cache
          # is content-addressed and always correctness-safe, while prebuilt
          # native libraries would need a producer/consumer toolchain-ABI
          # fingerprint to reuse outside the builder container. Native deps
          # keep building from source here.
      - name: Unit Testing
        id: ut
        run: |
          # Keep the explicit config and time it separately for the proxy canary.
          cd $GITHUB_WORKSPACE && make clean && time make config
          # Unsharded callers retain the repository-variable override. An
          # explicit sharded canary owns its per-runner budget so an inherited
          # variable cannot silently replace the requested experiment value.
          time make ut UT_CONFIGURED=1 UT_PARALLEL=${{ inputs.ut_sharded && inputs.ut_parallel || vars.UT_PARALLEL || inputs.ut_parallel }} UT_TIMEOUT=${{ vars.UT_TIMEOUT || 40 }} UT_SHARD=${{ matrix.ut_shard }}
      - name: Print Result(Old)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd $UT_WORKDIR;
          find scratch -name "**-UT-Count.out" -exec cat {} \+;
      - name: Print Skipped Tests
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE;
          find ./ut-report -name skipped.txt -exec cat {} \+;
      - name: Print No Test Case Packages
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE;
          find ./ut-report -name no-test.txt -exec cat {} \+;
      - name: Print Failed Packages and Tests
        id: failed
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd $GITHUB_WORKSPACE;
          if [ "$(find ./ut-report/failed | wc -l)" -le "2" ]; then
            exit 0;
          fi
          find ./ut-report/failed -name result.txt -exec cat {} \;
          fail_ut_cases=''
          files=($(find ./ut-report/failed | grep -v result.txt))
          for file in "${files[@]}"; do
            if [ -d "$file" ]; then
              continue
            fi
            echo "============================================"
            cat "${file}";
            fail_ut_cases=${fail_ut_cases}$(basename "${file}")','
          done

          echo "steps.ut.conclusion: ${{ steps.ut.conclusion }}"
          echo "FAIL_UT_CASES=${fail_ut_cases}"
          echo "FAIL_UT_CASES=${fail_ut_cases}" >> $GITHUB_OUTPUT
      - name: Print the Top 10 Time-Consuming Tests
        if: ${{ always() }}
        continue-on-error: true
        run: |
          find ./ut-report -name top.txt -exec cat {} \;

  # Preserve the established required-check name and make it an AND gate over
  # every shard. fail-fast=false above ensures one failure cannot hide missing
  # coverage by cancelling the other shards. Keep this job disabled for the
  # default single-runner mode: its real UT job already owns the required name,
  # so merging this workflow has no extra runner cost for existing callers.
  ut-linux-x86:
    if: ${{ always() && inputs.ut_sharded }}
    needs: ut-linux-x86-shard
    runs-on: ubuntu-22.04
    name: ${{ inputs.ut_sharded && 'UT Test on Ubuntu/x86' || 'UT shard summary (disabled)' }}
    steps:
      - name: Require every UT shard
        env:
          UT_SHARD_RESULT: ${{ needs.ut-linux-x86-shard.result }}
        run: |
          if [[ "${UT_SHARD_RESULT}" != "success" ]]; then
            echo "One or more UT shards did not succeed: ${UT_SHARD_RESULT}"
            exit 1
          fi
          echo "Every UT shard succeeded"

  ut-mac-x86:
    #if: ${{ !github.event.pull_request.draft }}
    if: ${{ false }}
    environment: ci
    runs-on: macos-15-intel
    name: UT Test on Darwin/x86

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          fetch-depth: "3"
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          setup-java: true
          go-version-file: "${{ github.workspace }}/go.mod"
      - uses: matrixorigin/setup-hdfs@master
        with:
          hdfs-download-url: "https://github.com/matrixorigin/CI/releases/download/hadoop-binary-3.4.1/hadoop-3.4.1.tar.gz"
      - name: Set env
        run: |
          echo "endpoint=${{ secrets.S3ENDPOINT }}" >> $GITHUB_ENV
          echo "region=${{ secrets.S3REGION }}" >> $GITHUB_ENV
          echo "apikey=${{ secrets.S3APIKEY }}" >> $GITHUB_ENV
          echo "apisecret=${{ secrets.S3APISECRET }}" >> $GITHUB_ENV
          echo "bucket=${{ secrets.S3BUCKET }}" >> $GITHUB_ENV
          # set ut workdir
          echo "UT_WORKDIR=${{ github.workspace }}" >> $GITHUB_ENV
      - name: Unit Testing
        run: |
          cd $GITHUB_WORKSPACE && make clean && make config
          make ut UT_PARALLEL=6
      - name: Print Result
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd $UT_WORKDIR;
          find scratch -name "**-UT-Count.out" -exec cat {} \;

  sca:
    environment: ci
    # SCA is CPU-bound but does not run the database or BVT; validate it on
    # the smaller standard ARM runner. A repository variable remains an
    # explicit escape hatch for a larger runner.
    runs-on: ${{ vars.SCA_RUNNER_LABEL || 'arm64-mo-shanghai-4c8g' }}
    timeout-minutes: 90
    name: SCA Test on Linux/arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          fetch-depth: "3"
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: thiagodnf/yaml-schema-checker@v0.0.12
        name: Check Issue Template
        with:
          jsonSchemaFile: .github/ISSUE_TEMPLATE/schema.json
          yamlFiles: |
            .github/ISSUE_TEMPLATE/*.yml
            .github/ISSUE_TEMPLATE/*.yaml
      - name: Configure Shanghai Go proxy
        if: ${{ !vars.SCA_RUNNER_LABEL || contains(vars.SCA_RUNNER_LABEL, 'shanghai') }}
        run: |
          echo "GOPROXY=http://goproxy.goproxy.svc.cluster.local|https://goproxy.cn|direct" >> "$GITHUB_ENV"
      - name: Set up Go
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          setup-java: false
          setup-cmake: true
          go-version-file: "${{ github.workspace }}/go.mod"
      - name: Clean generated SCA outputs
        run: |
          set -euo pipefail
          make clean
          rm -rf .sca-static-check-tools .sca-golangci-analysis-cache .sca-onnx-runtime
      - name: Resolve Go module cache metadata
        id: go-module-cache-metadata
        run: |
          set -euo pipefail
          cache_dir="$GITHUB_WORKSPACE/.sca-go-module-cache"
          # Self-hosted runner workspaces can outlive a job. Start from only the
          # trusted cache archive, not files left by a previous PR.
          GOMODCACHE="$cache_dir" go clean -modcache
          echo "GOMODCACHE=$cache_dir" >> "$GITHUB_ENV"
          echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # A relative path keeps both the hidden cache version and tar entries
          # identical to the trusted producer across different runner layouts.
          path: .sca-go-module-cache
          key: matrixone-go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-module-cache-metadata.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            matrixone-go-mod-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-module-cache-metadata.outputs.version }}-
      - name: Resolve Go module cache runtime layout
        id: go-module-cache-layout
        run: |
          set -euo pipefail
          # golangci-lint includes absolute compiled-file paths in its package
          # action IDs. The optimized MatrixOne contract explicitly excludes
          # this stable repository-local module cache from license scans.
          if grep -q '^static-check-analysis:' Makefile && \
            grep -Fqx "    - '.sca-go-module-cache/'" .licenserc.yml; then
            test "$(go env GOMODCACHE)" = "$GITHUB_WORKSPACE/.sca-go-module-cache"
            echo "analysis-compatible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Preserve the original out-of-tree behavior for MatrixOne branches
          # that predate the split SCA/cache contract. Their license config
          # does not ignore the module cache, so leaving it in the checkout
          # would make a complete header scan traverse third-party modules.
          staging_dir="$GOMODCACHE"
          runtime_root=$(mktemp -d "${RUNNER_TEMP%/}/matrixone-go-mod.XXXXXX")
          runtime_dir="$runtime_root/cache"
          if [[ -d "$staging_dir" ]]; then
            mv "$staging_dir" "$runtime_dir"
          else
            mkdir "$runtime_dir"
          fi
          echo "GOMODCACHE=$runtime_dir" >> "$GITHUB_ENV"
          echo "analysis-compatible=false" >> "$GITHUB_OUTPUT"
      - name: Restore golangci-lint analysis cache
        if: steps.go-module-cache-layout.outputs.analysis-compatible == 'true'
        uses: matrixorigin/CI/actions/restore-sca-analysis-cache@main
      # Keep these metadata outputs and the key schema aligned with
      # matrixorigin/matrixone:.github/workflows/sca-go-module-cache.yaml.
      - name: Resolve native cache metadata
        id: native-cache-metadata
        run: |
          set -euo pipefail
          compiler="$(cc -dumpmachine)-$(cc -dumpfullversion -dumpversion)"
          cxx_compiler="$(c++ -dumpmachine)-$(c++ -dumpfullversion -dumpversion)"
          cmake_version="$(cmake --version | sed -n '1p')"
          echo "compiler=${compiler// /_}" >> "$GITHUB_OUTPUT"
          echo "cxx-compiler=${cxx_compiler// /_}" >> "$GITHUB_OUTPUT"
          echo "cmake=${cmake_version// /_}" >> "$GITHUB_OUTPUT"
      - name: Resolve native SCA requirements
        id: native-requirements
        run: |
          set -euo pipefail
          # CI@main also serves maintenance branches that predate ONNX support.
          # Make the restored/built artifact contract follow the checked-out
          # MatrixOne generation instead of imposing main's dependency set.
          onnx_required=false
          if grep -Eq '^onnxruntime[[:space:]]*:' thirdparties/Makefile; then
            onnx_required=true
          fi
          echo "onnx-required=$onnx_required" >> "$GITHUB_OUTPUT"
      - name: Restore native SCA prerequisites
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            thirdparties/install
            cgo/*.o
            cgo/libmo.a
            cgo/libmo.so
          key: matrixone-sca-native-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.native-cache-metadata.outputs.compiler }}-${{ steps.native-cache-metadata.outputs.cxx-compiler }}-${{ steps.native-cache-metadata.outputs.cmake }}-${{ hashFiles('Makefile', 'cgo/*.c', 'cgo/*.h', 'cgo/Makefile', 'thirdparties/Makefile', 'thirdparties/*.tar.gz', 'thirdparties/download') }}
      - name: Validate restored native SCA prerequisites
        id: native-cache-state
        run: |
          set -euo pipefail
          usable=false
          onnx_usable=true
          if [[ "${{ steps.native-requirements.outputs.onnx-required }}" == "true" ]] && \
            [[ -z "$(find thirdparties/install/lib -maxdepth 1 -type f -name 'onnxruntime*.so' -print -quit)" ]]; then
            onnx_usable=false
          fi
          if [[ "${{ steps.native-cache.outputs.cache-hit }}" == "true" ]] && \
            [[ -f thirdparties/install/include/xxhash.h ]] && \
            [[ -f thirdparties/install/include/usearch.h ]] && \
            [[ -f thirdparties/install/lib/libroaring.a ]] && \
            [[ -f thirdparties/install/lib/libusearch_c.a ]] && \
            [[ "$onnx_usable" == "true" ]] && \
            [[ -f cgo/libmo.a ]] && \
            [[ -f cgo/libmo.so ]]; then
            usable=true
          elif [[ "${{ steps.native-cache.outputs.cache-hit }}" == "true" ]]; then
            echo "::warning::The exact native SCA cache is incomplete; rebuilding from verified inputs"
          fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"
      - name: Restore ONNX Runtime fallback
        id: onnx-cache
        if: steps.native-cache-state.outputs.usable != 'true' && steps.native-requirements.outputs.onnx-required == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sca-onnx-runtime
          key: matrixone-sca-onnx-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('thirdparties/Makefile', 'thirdparties/download') }}
      - name: Validate restored ONNX Runtime fallback
        id: onnx-cache-state
        if: steps.native-cache-state.outputs.usable != 'true' && steps.native-requirements.outputs.onnx-required == 'true'
        run: |
          set -euo pipefail
          usable=false
          if [[ "${{ steps.onnx-cache.outputs.cache-hit }}" == "true" ]]; then
            mapfile -t onnx_files < <(find .sca-onnx-runtime -maxdepth 1 -type f -name 'onnxruntime*.so' -print)
            if [[ "${#onnx_files[@]}" -eq 1 ]] && \
              [[ -f .sca-onnx-runtime/SHA256SUMS ]] && \
              (cd .sca-onnx-runtime && sha256sum --check --strict SHA256SUMS); then
              usable=true
            else
              echo "::warning::The ONNX Runtime fallback cache is incomplete or corrupt; using the normal verified download path"
              rm -rf .sca-onnx-runtime
            fi
          fi
          echo "usable=$usable" >> "$GITHUB_OUTPUT"
      - name: Resolve static-check tool cache metadata
        id: static-check-tool-cache-metadata
        run: |
          set -euo pipefail
          recipe_hash="$(sed -n '/^install-static-check-tools:/,/^$/p' Makefile | sha256sum | awk '{print $1}')"
          test -n "$recipe_hash"
          echo "recipe-hash=$recipe_hash" >> "$GITHUB_OUTPUT"
      - name: Restore static-check tools
        id: static-check-tool-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .sca-static-check-tools
          key: matrixone-sca-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-module-cache-metadata.outputs.version }}-${{ steps.static-check-tool-cache-metadata.outputs.recipe-hash }}
      - name: Prepare ENV
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # The final static-check target owns the single full package-graph
          # verification. Running config here as a separate make invocation
          # duplicated `go list -test ./...` on every successful SCA job.
          if [[ "${{ steps.native-cache-state.outputs.usable }}" == "true" ]]; then
            echo "Using verified native SCA cache"
          else
            # Top-level cgo owns one complete native generation. Running
            # thirdparties separately is both redundant and unsafe: cgo can
            # discard that unstamped generation and download ONNX again.
            if [[ "${{ steps.onnx-cache-state.outputs.usable }}" == "true" ]]; then
              make ONNX_PREBUILT_DIR="$GITHUB_WORKSPACE/.sca-onnx-runtime" cgo
            else
              make cgo
            fi
          fi
          test -f thirdparties/install/include/xxhash.h
          test -f thirdparties/install/include/usearch.h
          test -f thirdparties/install/lib/libroaring.a
          test -f thirdparties/install/lib/libusearch_c.a
          if [[ "${{ steps.native-requirements.outputs.onnx-required }}" == "true" ]]; then
            find thirdparties/install/lib -maxdepth 1 -type f -name 'onnxruntime*.so' -print -quit | grep -q .
          fi
          test -f cgo/libmo.a
          test -f cgo/libmo.so
          rm -rf "$GITHUB_WORKSPACE/lib"
          cp -r thirdparties/install/lib "$GITHUB_WORKSPACE/lib"
          rm -rf .sca-onnx-runtime
      - name: Prepare static-check tools
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d "${RUNNER_TEMP%/}/matrixone-sca-tools.XXXXXX")"
          staging_dir="$GITHUB_WORKSPACE/.sca-static-check-tools"
          if [[ "${{ steps.static-check-tool-cache.outputs.cache-hit }}" == "true" ]] && \
            [[ -x "$staging_dir/golangci-lint" ]] && \
            [[ -x "$staging_dir/molint" ]] && \
            [[ -x "$staging_dir/license-eye" ]]; then
            mv "$staging_dir"/* "$runtime_dir/"
          else
            retry_times=5
            delay=10
            for ((i = 1; i <= retry_times; i++)); do
              if make install-static-check-tools; then
                break
              fi
              if [ "$i" -eq "$retry_times" ]; then
                echo "install-static-check-tools failed after ${retry_times} attempts"
                exit 1
              fi
              echo "install-static-check-tools attempt ${i} failed, retrying in ${delay}s..."
              sleep "$delay"
            done
            tool_bin="$(go env GOPATH)/bin"
            cp "$tool_bin/golangci-lint" "$tool_bin/molint" "$tool_bin/license-eye" "$runtime_dir/"
          fi
          test -x "$runtime_dir/golangci-lint"
          test -x "$runtime_dir/molint"
          test -x "$runtime_dir/license-eye"
          echo "$runtime_dir" >> "$GITHUB_PATH"
      - name: Resolve PR license scope
        id: license-scope
        if: steps.go-module-cache-layout.outputs.analysis-compatible == 'true'
        continue-on-error: true
        uses: matrixorigin/CI/actions/resolve-sca-license-scope@main
        with:
          github-token: ${{ secrets.TOKEN_ACTION || github.token }}
      - name: Static Code Analysis
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          # Keep the legacy path byte-for-byte equivalent during the two-PR
          # rollout. The optimized path is enabled only after MatrixOne adds
          # the companion target.
          if ! grep -q '^static-check-analysis:' Makefile; then
            echo "Incremental license target is unavailable; using complete static-check"
            make static-check
            exit 0
          fi

          # API/rate-limit/transient failures above must conservatively become
          # the original complete checks, never a false green or a red gate.
          license_header_full="${SCA_LICENSE_HEADER_FULL:-true}"
          license_dependency_check="${SCA_LICENSE_DEPENDENCY_CHECK:-true}"
          license_paths_file="${SCA_LICENSE_PATHS_FILE:-}"
          if [[ "$license_header_full" != "true" ]] && \
            [[ ! -f "$license_paths_file" ]]; then
            echo "PR license scope is unavailable; using complete header check"
            license_header_full="true"
          fi
          expected_config_hash="96ac6e17a14a0a93177a965dd842f3311fd4a62a0a2d4efa252c6bb78281e9f7"
          expected_tool_recipe_hash="16f233e8b83183889fa284d3b354fbf08c2d2b3630e87f93c7c0e9a67d1548f1"
          config_hash="$(sha256sum .licenserc.yml | awk '{print $1}')"
          tool_recipe_hash="$(sed -n '/^install-static-check-tools:/,/^$/p' Makefile | sha256sum | awk '{print $1}')"
          if [[ "$config_hash" != "$expected_config_hash" ]] || \
            [[ "$tool_recipe_hash" != "$expected_tool_recipe_hash" ]]; then
            echo "License configuration or tool recipe is newer than the validated incremental contract; using complete license checks"
            license_header_full="true"
            license_dependency_check="true"
          fi

          if [[ "$license_header_full" == "true" ]]; then
            license-eye -c .licenserc.yml header check
          else
            mapfile -d '' -t license_paths < "$license_paths_file"
            if (( ${#license_paths[@]} > 0 )); then
              license-eye -c .licenserc.yml header check -- "${license_paths[@]}"
            else
              echo "No added, copied, modified, or renamed files require a license header check"
            fi
          fi

          if [[ "$license_dependency_check" == "true" ]]; then
            license-eye -c .licenserc.yml dep check
          else
            echo "Dependency manifests and license rules are unchanged"
          fi

          # Run cheap policy checks before the long analyzers so an invalid PR
          # fails in seconds rather than consuming the full SCA critical path.
          make static-check-analysis GOLANGCI_LINT_CONCURRENCY=1
