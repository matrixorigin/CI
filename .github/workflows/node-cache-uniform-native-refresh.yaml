# Generated by scripts/build_uniform_native_refresh_workflow.py; ordinary PR jobs unchanged.
name: Uniform-environment native-only preparation (no UT/Go precompile)
'on':
  workflow_call:
    secrets:
      CS_COVERAGE_CACHE_READ_TOKEN:
        required: false
      TOKEN_ACTION:
        required: false
    inputs:
      environment:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  authorize:
    if: github.repository == 'matrixorigin/matrixone' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test'
      && github.actor == 'Ariznawlll' && github.run_attempt == 1 && contains(fromJSON('["jed","mnl2","ruh"]'), inputs.environment)
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.scope.outputs.allowed }}
    steps:
    - id: scope
      run: echo 'allowed=true' >> "$GITHUB_OUTPUT"
  native-only:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        node:
        - mo-standard-0
    runs-on: ${{ format('cs-{0}-nc-n0-pr-v1', inputs.environment) }}
    timeout-minutes: 70
    env:
      GOMAXPROCS: '7'
      GOTOOLCHAIN: local
      GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
      CGO_ENABLED: '1'
      GOFLAGS: ''
      GOWORK: 'off'
      COVERAGE_GROUP: '0'
      COVERAGE_UT_CGO_TIMEOUT_SECONDS: '1800'
      CS_CACHE_SOURCE_REPOSITORY: matrixorigin/matrixone
    steps:
    - name: One-time native preparation system dependencies (separate cost)
      timeout-minutes: 10
      run: |
        set -euo pipefail
        test "$CS_CACHE_ENV" = mty
        test "$CS_CACHE_NODE" = '${{ matrix.node }}'
        test "$CS_CACHE_EXPECTED_NODE" = '${{ matrix.node }}'
        started=$SECONDS
        bootstrap=false
        if command -v gcc && command -v g++ && command -v make && command -v pkg-config && command -v cmake && command -v python; then
          echo 'System build dependencies already available.'
        else
          bootstrap=true
          sudo apt-get -o Acquire::ForceIPv4=true update
          sudo apt-get -o Acquire::ForceIPv4=true install -y build-essential cmake pkg-config python3 python-is-python3
        fi
        for tool in cc c++ make pkg-config python3 jq git; do command -v "$tool"; done
        # This is first-time CPU-generation preparation, not an ordinary PR
        # consumer. Distro CMake may download here. Do not misreport the
        # subsequent PVC Go/CMake restore's zero downloads as zero job-wide.
        jq -n --argjson performed "$bootstrap" --argjson seconds "$((SECONDS-started))" \
          '{one_time_producer_preparation:true,system_dependency_bootstrap_performed:$performed,seconds:$seconds,job_wide_zero_tool_downloads_claimed:false}' \
          > "$RUNNER_TEMP/system-dependency-bootstrap.json"
    - name: Checkout exact canonical trusted native source
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: matrixorigin/matrixone
        ref: 87c44445f83e308ef12dd7ca0e570cec1e6690d9
        persist-credentials: false
    - name: Checkout immutable native-only helpers
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        token: ${{ secrets.TOKEN_ACTION || github.token }}
        path: .ci-workflow
        persist-credentials: false
        sparse-checkout: |
          scripts
          config
        sparse-checkout-cone-mode: true
    - name: Restore exact persistent Go and CMake without external downloads
      timeout-minutes: 5
      run: |
        set -euo pipefail
        python3 .ci-workflow/scripts/node_cache_toolchain_store.py --catalog .ci-workflow/config/node-compile-cache-catalog.json --lock .ci-workflow/config/node-toolchain-lock.json --destination "$RUNNER_TEMP/node-toolchain-install" --report "$RUNNER_TEMP/persistent-toolchain.json"
        for path in cs-buildcache-gomod cs-buildcache-go cs-node-cache native-only-candidate; do test ! -e "$RUNNER_TEMP/$path"; done
        echo "GOMODCACHE=$RUNNER_TEMP/cs-buildcache-gomod" >> "$GITHUB_ENV"
        echo "GOCACHE=$RUNNER_TEMP/cs-buildcache-go" >> "$GITHUB_ENV"
    - name: Require exact observed native key, CPU, tools and readonly node binding
      timeout-minutes: 5
      env:
        CS_CACHE_READ_TOKEN: ${{ secrets.CS_COVERAGE_CACHE_READ_TOKEN || github.token }}
      run: |
        set -euo pipefail
        python3 .ci-workflow/scripts/node_cache_pvc_authority.py materialize
        python3 .ci-workflow/scripts/node_compile_cache.py configure --catalog "$RUNNER_TEMP/cs-reviewed-persistent-catalog.json"
        python3 .ci-workflow/scripts/node_cache_native_refresh.py preflight --state "$RUNNER_TEMP/cs-node-cache/state.json" --request .ci-workflow/config/node-native-uniform-request-${{ inputs.environment }}.json --catalog "$RUNNER_TEMP/cs-reviewed-persistent-catalog.json"
    - name: Build only missing native outputs privately, no UT or Go precompile
      timeout-minutes: 30
      run: |
        set -euo pipefail
        python3 .ci-workflow/scripts/node_compile_cache.py prepare-native --state "$RUNNER_TEMP/cs-node-cache/state.json"
    - name: Freeze native-only unpublished candidate, excluding all Go actions
      timeout-minutes: 15
      run: |
        set -euo pipefail
        python3 .ci-workflow/scripts/node_cache_native_refresh.py freeze --state "$RUNNER_TEMP/cs-node-cache/state.json" --request .ci-workflow/config/node-native-uniform-request-${{ inputs.environment }}.json --destination "$RUNNER_TEMP/native-only-candidate"
    - name: Upload UNPUBLISHED candidate for independent protected review
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-only-candidate-${{ inputs.environment }}-${{ matrix.node }}-${{ github.run_id }}
        path: |-
          ${{ runner.temp }}/native-only-candidate/manifest.json
          ${{ runner.temp }}/native-only-candidate/delta.tar.gz
        if-no-files-found: error
        compression-level: 0
        retention-days: 7
    - name: Preserve preparation and exact-key evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: native-refresh-evidence-${{ inputs.environment }}-${{ matrix.node }}-${{ github.run_id }}
        path: |-
          ${{ runner.temp }}/system-dependency-bootstrap.json
          ${{ runner.temp }}/persistent-toolchain.json
          ${{ runner.temp }}/cs-node-cache/state.json
          ${{ runner.temp }}/cs-node-cache/native-result.json
          ${{ runner.temp }}/cs-node-cache/native-refresh-preflight.json
          ${{ runner.temp }}/cs-node-cache/failure-reports
        if-no-files-found: error
        retention-days: 7
