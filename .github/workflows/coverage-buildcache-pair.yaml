name: Isolated all-package Coverage compilation cache cold warm pair
on:
  workflow_call:
    secrets:
      TOKEN_ACTION:
        required: true
      CS_S3_MTY_CONFIG:
        required: true
      CS_S3_MNL2_CONFIG:
        required: true
      CS_S3_JED_CONFIG:
        required: true
      CS_S3_RUH_CONFIG:
        required: true
permissions:
  contents: read
jobs:
  validate-versions:
    name: Validate immutable source arm and helper versions
    if: github.repository == 'matrixorigin/matrixone' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test' && github.actor == 'Ariznawlll'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable version graph
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/CI
          ref: ecd5a7f7080a8a511d476404c75aff6be5c66a33
          token: ${{ secrets.TOKEN_ACTION }}
          persist-credentials: false
          fetch-depth: 0
      - name: Validate pinned arm and its committed helper before allocating CS runners
        run: python3 scripts/check_buildcache_versions.py --arm-ref ecd5a7f7080a8a511d476404c75aff6be5c66a33 --expected-source dbc7ca14ca8b01cfe6d9e9a151619ea4b5ba14ca
  validate-cleanup:
    needs: [validate-versions]
    name: Validate download fixture cleanup before cache comparison
    if: github.repository == 'matrixorigin/matrixone' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/weilu-runner-test' && github.actor == 'Ariznawlll'
    runs-on: cs-mnl2-large-7c14g
    timeout-minutes: 60
    env:
      GOMAXPROCS: '7'
      GOFLAGS: ''
      GOWORK: 'off'
      GOPROXY: https://goproxy.cn|https://proxy.golang.org|direct
    steps:
      - name: Check isolated runner and disk headroom
        run: |
          set -euo pipefail
          case "$RUNNER_NAME" in cs-mnl2-*) ;; *) exit 1 ;; esac
          for path in "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; do
            test "$(df -Pk "$path" | awk 'NR==2 {print $4}')" -ge 62914560
          done
          test ! -e "$RUNNER_TEMP/cleanup-gocache"
          test ! -e "$RUNNER_TEMP/cleanup-gomod"
          echo "GOCACHE=$RUNNER_TEMP/cleanup-gocache" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$RUNNER_TEMP/cleanup-gomod" >> "$GITHUB_ENV"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/matrixone
          ref: dbc7ca14ca8b01cfe6d9e9a151619ea4b5ba14ca
          token: ${{ secrets.TOKEN_ACTION }}
          persist-credentials: false
      - uses: matrixorigin/CI/actions/setup-env@4670989748419fb169f88282cf05fb690ea91074
        with:
          setup-java: false
          go-version-file: '${{ github.workspace }}/go.mod'
          cache: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: matrixorigin/CI
          ref: 4670989748419fb169f88282cf05fb690ea91074
          token: ${{ secrets.TOKEN_ACTION }}
          persist-credentials: false
          path: .ci-workflow
          sparse-checkout: scripts/prepare_coverage_cgo.sh
          sparse-checkout-cone-mode: false
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          if ! (command -v gcc && command -v g++ && command -v make && command -v pkg-config && command -v cmake); then
            sudo apt-get -o Acquire::ForceIPv4=true update
            sudo apt-get -o Acquire::ForceIPv4=true install -y build-essential cmake pkg-config
          fi
      - name: Prepare native libraries with original provenance checks
        timeout-minutes: 30
        run: |
          set -euo pipefail
          timeout --kill-after=30s 1700s .ci-workflow/scripts/prepare_coverage_cgo.sh > "$RUNNER_TEMP/cleanup-native.log" 2>&1
      - name: Repeat actual cancellation and cleanup regressions
        timeout-minutes: 25
        run: |
          set -euo pipefail
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 20971520
          export CGO_CFLAGS="-I$GITHUB_WORKSPACE/cgo -I$GITHUB_WORKSPACE/thirdparties/install/include"
          export CGO_LDFLAGS="-L$GITHUB_WORKSPACE/cgo -lmo -Wl,-rpath,$GITHUB_WORKSPACE/cgo -L$GITHUB_WORKSPACE/thirdparties/install/lib -lusearch_c -Wl,-rpath,$GITHUB_WORKSPACE/thirdparties/install/lib -lm"
          # No S3 configuration is passed to this job. These tests only use
          # owned temporary directories and pipe-backed download fixtures.
          timeout --kill-after=30s 1100s go test -mod=readonly -count=100 -json -short -tags matrixone_test -timeout=10m -p 2 \
            ./pkg/fileservice -run '^(TestDiskCacheReadOfDownloadStopsOnCancel|TestDiskCacheDownloadCleanupWaitsForWriter)$' > "$RUNNER_TEMP/cleanup-repeat.json"
          timeout --kill-after=30s 300s go test -mod=readonly -count=10 -json -short -tags matrixone_test -timeout=4m -p 2 \
            ./pkg/fileservice -run '^(TestDiskCacheReadWaitsForDownloadedBytes|TestDiskCacheReadFallsBackWhenDownloadFails|TestDiskCacheReadBeyondDownloadedObject|TestObjectDownloadReadableAfterPublishOrRemoval|TestDiskCacheReadKeepsWaitingForChosenDownload)$' > "$RUNNER_TEMP/cleanup-neighbours.json"
          python3 - <<'PY'
          import collections, json, os
          from pathlib import Path
          checks = [
              ('cleanup-repeat.json', 100, ['TestDiskCacheReadOfDownloadStopsOnCancel', 'TestDiskCacheDownloadCleanupWaitsForWriter']),
              ('cleanup-neighbours.json', 10, ['TestDiskCacheReadWaitsForDownloadedBytes', 'TestDiskCacheReadFallsBackWhenDownloadFails', 'TestDiskCacheReadBeyondDownloadedObject', 'TestObjectDownloadReadableAfterPublishOrRemoval', 'TestDiskCacheReadKeepsWaitingForChosenDownload']),
          ]
          for filename, repeats, tests in checks:
              events = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / filename).read_text().splitlines()]
              assert not any(e['Action'] in ('fail', 'skip') for e in events), filename
              passes = collections.Counter(e.get('Test') for e in events if e['Action'] == 'pass')
              assert all(passes[test] == repeats for test in tests), (filename, passes)
              print(filename, 'verified', len(tests), 'tests x', repeats)
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cleanup-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cleanup-repeat.json
            ${{ runner.temp }}/cleanup-neighbours.json
            ${{ runner.temp }}/cleanup-native.log
          retention-days: 14
  cold:
    needs: [validate-cleanup]
    uses: matrixorigin/CI/.github/workflows/coverage-buildcache-arm.yaml@ecd5a7f7080a8a511d476404c75aff6be5c66a33
    with:
      cache_mode: cold
    secrets: inherit
  warm:
    needs: [cold]
    if: ${{ needs.cold.outputs.coverage_status == 'passed' }}
    uses: matrixorigin/CI/.github/workflows/coverage-buildcache-arm.yaml@ecd5a7f7080a8a511d476404c75aff6be5c66a33
    with:
      cache_mode: warm
    secrets: inherit
  verify-pair:
    needs: [cold, warm]
    if: ${{ !cancelled() && always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require both complete Coverage arms
        env:
          COLD: ${{ needs.cold.outputs.coverage_status }}
          WARM: ${{ needs.warm.outputs.coverage_status }}
        run: test "$COLD" = passed && test "$WARM" = passed
      - uses: actions/download-artifact@v4
        with:
          name: cold-ut-coverage-combined-skips-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparison/cold/skips
      - uses: actions/download-artifact@v4
        with:
          name: warm-ut-coverage-combined-skips-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparison/warm/skips
      - uses: actions/download-artifact@v4
        with:
          name: cold-ut-coverage-generation-${{ github.run_id }}-${{ github.run_attempt }}-attempt-${{ github.run_attempt }}
          path: comparison/cold/profile
      - uses: actions/download-artifact@v4
        with:
          name: warm-ut-coverage-generation-${{ github.run_id }}-${{ github.run_attempt }}-attempt-${{ github.run_attempt }}
          path: comparison/warm/profile
      - name: Compare every package skip and coverage instrumentation scope
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('comparison')
          manifests=[json.loads((root/arm/'skips/combined-skip-manifest.json').read_text()) for arm in ('cold','warm')]
          for m in manifests:
              assert m['source_sha']=='dbc7ca14ca8b01cfe6d9e9a151619ea4b5ba14ca'
              assert m['storage_mode']=='cs-s3'
              assert not m['failed'] and not m['package_timeouts'] and not m['malformed_events']
              assert len(m['started_packages'])==505
          cold,warm=manifests
          assert set(cold['started_packages'])==set(warm['started_packages'])
          key=lambda t:(t['package'],t['test'])
          assert sorted(cold['skipped_tests'],key=key)==sorted(warm['skipped_tests'],key=key), 'per-test skip mismatch'
          def blocks(arm):
              lines=(root/arm/'profile/ut-coverage.out').read_text().splitlines()
              assert lines[0]=='mode: set' and len(lines)>1
              return {tuple(line.split()[:2]) for line in lines[1:]}
          assert blocks('cold')==blocks('warm'), 'instrumentation scope mismatch'
          result={'source':cold['source_sha'],'packages':505,'skipped_tests':len(cold['skipped_tests']),
                  'same_packages':True,'same_skips':True,'same_instrumentation_scope':True,
                  'note':'Tests rerun with count=1. Compare full job times including cache transfer; no half-hour claim.'}
          (root/'acceptance.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Both full Coverage arms passed; 505 packages, identical per-test skips and instrumentation scope.\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: build-cache-pair-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: comparison/acceptance.json
          if-no-files-found: error
          retention-days: 14
