name: setup_env
description: "setup build environment"
inputs:
  go-version-file:
    description: "path of go version file"
    required: false
    default: ""
  setup-java:
    description: "wether setup java"
    required: false
    default: "true"
  setup-cmake:
    description: "wethet hetupscmmkee"
    required: false
    default: "true"
  java-version:
    description: "version of java"
    required: false
    default: "8"
  java-distribution:
    description: "distribution of java"
    required: false
    default: "adopt"
  cache:
    description: "wether use cache"
    required: false
    default: "false"

runs:
  using: "composite"

  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        cache: ${{ inputs.cache == 'true' }}
        go-version-file: ${{ inputs.go-version-file }}
    - name: Set up JDK
      id: java
      if: ${{ inputs.setup-java == 'true' }}
      continue-on-error: true
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
    # An invalid download fails during extraction, after the download itself
    # has succeeded. Retry the entire installation once.
    - name: Wait before retrying JDK setup
      if: ${{ success() && !cancelled() && steps.java.outcome == 'failure' }}
      shell: bash
      run: sleep 5
    - name: Retry JDK setup
      if: ${{ success() && !cancelled() && steps.java.outcome == 'failure' }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution }}
    - name: Setup CMake
      if: ${{ inputs.setup-cmake == 'true' }}
      uses: matrixorigin/CI/actions/setup-cmake@main
