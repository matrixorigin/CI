name: Admit and collect one coverage group
on:
  workflow_call:
    inputs:
      group: {type: number, required: true}
      head: {type: string, required: true}
      source: {type: string, required: true}
      enable_cs_site_retry: {type: boolean, default: false}
      enable_cs_first_pool: {type: boolean, default: false}
      first_pool_snapshot: {type: string, default: ''}
      enable_4_2_dev: {type: boolean, required: false, default: false}
    secrets:
      TOKEN_ACTION: {required: false}
      CS_COVERAGE_CACHE_READ_TOKEN: {required: false}
permissions:
  contents: read
jobs:
  select:
    name: GROUP${{ inputs.group }}
    if: >-
      github.event_name == 'pull_request_target' &&
      (github.workflow_ref == 'matrixorigin/matrixone/.github/workflows/entrypoint.yaml@refs/heads/main' ||
      (inputs.enable_4_2_dev && github.event.pull_request.base.ref == '4.2-dev' &&
      github.workflow_ref == 'matrixorigin/matrixone/.github/workflows/entrypoint.yaml@refs/heads/4.2-dev')) &&
      (github.event.pull_request.base.ref == 'main' ||
      (inputs.enable_4_2_dev && github.event.pull_request.base.ref == '4.2-dev'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: ci
    permissions:
      contents: read
      actions: write
    outputs:
      child: ${{ steps.select.outputs.child }}
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: matrixorigin/CI
        ref: ${{ job.workflow_sha }}
        sparse-checkout: |
          scripts/coverage_standby.py
          scripts/coverage_pr_entry.py
        sparse-checkout-cone-mode: false
        persist-credentials: false
    - if: github.run_attempt > 1
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        repository: matrixorigin/CI
        ref: 7a8cf1854da5ca4cc5ffb5a1f2cbc454162ad589
        path: reviewed
        sparse-checkout: |
          scripts
          config
        persist-credentials: false
    - id: retry_auth
      if: github.run_attempt > 1
      name: Reauthorize the exact live PR before dispatching a retry
      env:
        CS_PR_METADATA_TOKEN: ${{ secrets.TOKEN_ACTION }}
        CS_CACHE_READ_TOKEN: ${{ secrets.CS_COVERAGE_CACHE_READ_TOKEN || github.token }}
        COVERAGE_ADMITTED_SOURCE: ${{ inputs.source }}
        COVERAGE_ADMITTED_HEAD: ${{ inputs.head }}
        COVERAGE_ENABLE_4_2_DEV: ${{ inputs.enable_4_2_dev }}
      run: PYTHONPATH="$GITHUB_WORKSPACE/reviewed/scripts" python3 scripts/coverage_pr_entry.py
    - if: github.run_attempt > 1
      name: Verify retry eligibility and pinned source
      env:
        ALLOWED: ${{ steps.retry_auth.outputs.allowed }}
        LIVE_HEAD: ${{ steps.retry_auth.outputs.head_sha }}
        LIVE_SOURCE: ${{ steps.retry_auth.outputs.head_repository }}
        HEAD: ${{ inputs.head }}
        SOURCE: ${{ inputs.source }}
      run: test "$ALLOWED" = true && test "$LIVE_HEAD" = "$HEAD" && test "$LIVE_SOURCE" = "$SOURCE"
    - if: github.run_attempt > 1
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: real-pr-retry-${{ github.run_id }}-attempt-${{ github.run_attempt }}-group-${{ inputs.group }}
        path: ${{ runner.temp }}/real-pr-authorization.json
        if-no-files-found: error
    - id: select
      name: Find a CS runner or use Shanghai standby
      timeout-minutes: 85
      env:
        PR: ${{ github.event.pull_request.number }}
        GROUP: ${{ inputs.group }}
        HEAD: ${{ inputs.head }}
        SOURCE: ${{ inputs.source }}
        # The capacity-aware path makes one exact probe, then goes straight
        # back to the shared queue instead of stacking the old site sweep.
        COVERAGE_CS_SITE_RETRY: ${{ inputs.enable_cs_site_retry && !inputs.enable_cs_first_pool }}
        COVERAGE_CS_FIRST_POOL_ENABLED: ${{ inputs.enable_cs_first_pool }}
        COVERAGE_CS_FIRST_POOL_SNAPSHOT: ${{ inputs.first_pool_snapshot }}
        COVERAGE_ENABLE_4_2_DEV: ${{ inputs.enable_4_2_dev }}
        ACTIONS_TOKEN: ${{ github.token }}
      run: python3 -I scripts/coverage_standby.py choose
    - name: Release exactly one worker
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: coverage-admit-${{ steps.select.outputs.child }}
        path: ${{ runner.temp }}/grant.json
        if-no-files-found: error
        retention-days: 1
    # A failed child must fail the job that dispatched it. Failed-only reruns
    # now create a new child for this group, not a new poll of the dead child.
    - id: wait
      name: Wait for selected group, including its UT result
      env:
        CHILD: ${{ steps.select.outputs.child }}
        POOL: ${{ steps.select.outputs.pool }}
        GROUP: ${{ inputs.group }}
        COVERAGE_CS_SITE: ${{ steps.select.outputs.site }}
        COVERAGE_CS_SCALE_SET: ${{ steps.select.outputs.scale_set }}
        ACTIONS_TOKEN: ${{ github.token }}
      run: python3 -I scripts/coverage_standby.py wait
    - name: Cancel the selected worker if the selector stops
      if: >-
        ${{ always() && steps.wait.outcome != 'success' &&
            (steps.select.outputs.child != '' || steps.select.outcome == 'failure' || steps.select.outcome == 'cancelled') }}
      timeout-minutes: 2
      env:
        CHILD: ${{ steps.select.outputs.child }}
        GROUP: ${{ inputs.group }}
        HEAD: ${{ inputs.head }}
        SOURCE: ${{ inputs.source }}
        PR: ${{ github.event.pull_request.number }}
        ACTIONS_TOKEN: ${{ github.token }}
      run: python3 -I scripts/coverage_standby.py revoke
  collect:
    name: Collect Group ${{ inputs.group }} coverage
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
    - name: Collect selected child's skips
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        github-token: ${{ github.token }}
        run-id: ${{ needs.select.outputs.child }}
        name: ut-coverage-skips-group-${{ inputs.group }}-${{ needs.select.outputs.child }}-1
        path: ${{ runner.temp }}/skips
    - name: Retain skips in parent's original generation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ut-coverage-skips-group-${{ inputs.group }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/skips/*
        if-no-files-found: error
        retention-days: 7
    - name: Collect selected child's profile
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        github-token: ${{ github.token }}
        run-id: ${{ needs.select.outputs.child }}
        name: ut-coverage-group-${{ inputs.group }}-generation-${{ needs.select.outputs.child }}-1
        path: ${{ runner.temp }}/profile
    - name: Retain profile in parent's original generation
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ut-coverage-group-${{ inputs.group }}-generation-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/profile/ut-coverage.out
        if-no-files-found: error
        retention-days: 7
