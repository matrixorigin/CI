name: setup_env
description: "setup build environment"
inputs:
  go-version-file:
    description: "path of go version file"
    required: false
    default: ""
  setup-java:
    description: "wether setup java"
    required: false
    default: "true"
  setup-cmake:
    description: "wethet hetupscmmkee"
    required: false
    default: "true"
  java-version:
    description: "version of java"
    required: false
    default: "8"
  java-distribution:
    description: "JDK distribution override. Java 8 defaults to Temurin with Zulu fallback."
    required: false
    default: ""
  cache:
    description: "wether use cache"
    required: false
    default: "false"

runs:
  using: "composite"

  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        cache: ${{ inputs.cache == 'true' }}
        go-version-file: ${{ inputs.go-version-file }}
    - name: Set up JDK
      id: java
      if: ${{ inputs.setup-java == 'true' }}
      continue-on-error: true
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution || (inputs.java-version == '8' && 'temurin') || 'adopt' }}
    # Retry explicit choices with the same distribution. The default Java 8
    # retry goes through an independent provider after a Temurin failure.
    - name: Wait before retrying JDK setup
      if: ${{ success() && !cancelled() && steps.java.outcome == 'failure' && (inputs.java-distribution != '' || inputs.java-version != '8') }}
      shell: bash
      run: sleep 5
    - name: Retry JDK setup
      if: ${{ success() && !cancelled() && steps.java.outcome == 'failure' }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: ${{ inputs.java-distribution || (inputs.java-version == '8' && 'zulu') || 'adopt' }}
    - name: Setup CMake
      if: ${{ inputs.setup-cmake == 'true' }}
      uses: matrixorigin/CI/actions/setup-cmake@main
