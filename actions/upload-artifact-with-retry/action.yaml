name: Upload artifact with retry
description: Retry artifact publication failures without rerunning producer work.

inputs:
  name:
    description: Artifact name owned by one job within the workflow run; retries overwrite this name.
    required: true
  path:
    description: File, directory, or multiline path specification to upload.
    required: true
  if-no-files-found:
    description: Behavior when no input files exist.
    required: false
    default: error
  retention-days:
    description: Number of days to retain the artifact.
    required: false
    default: "7"
  overwrite:
    description: Delete an existing same-name artifact before the first attempt.
    required: false
    default: "false"
  compression-level:
    description: Zlib compression level passed to actions/upload-artifact.
    required: false
    default: "6"

outputs:
  artifact-id:
    description: GitHub ID of the artifact published by the successful attempt.
    value: ${{ steps.upload_3.outcome == 'success' && steps.upload_3.outputs['artifact-id'] || steps.upload_2.outcome == 'success' && steps.upload_2.outputs['artifact-id'] || steps.upload_1.outcome == 'success' && steps.upload_1.outputs['artifact-id'] || '' }}
  artifact-url:
    description: Authenticated download URL of the artifact published by the successful attempt.
    value: ${{ steps.upload_3.outcome == 'success' && steps.upload_3.outputs['artifact-url'] || steps.upload_2.outcome == 'success' && steps.upload_2.outputs['artifact-url'] || steps.upload_1.outcome == 'success' && steps.upload_1.outputs['artifact-url'] || '' }}
  artifact-digest:
    description: SHA-256 digest of the artifact published by the successful attempt.
    value: ${{ steps.upload_3.outcome == 'success' && steps.upload_3.outputs['artifact-digest'] || steps.upload_2.outcome == 'success' && steps.upload_2.outputs['artifact-digest'] || steps.upload_1.outcome == 'success' && steps.upload_1.outputs['artifact-digest'] || '' }}

runs:
  using: composite
  steps:
    - name: Upload artifact (attempt 1/3)
      id: upload_1
      # Preserve an outer caller's always() semantics when the job was already
      # failing before it entered this composite action.
      if: ${{ !cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        overwrite: ${{ inputs.overwrite }}
        compression-level: ${{ inputs.compression-level }}

    - name: Back off before artifact upload retry 1
      if: ${{ !cancelled() && steps.upload_1.outcome == 'failure' }}
      continue-on-error: true
      shell: bash
      run: |
        echo '::warning title=Artifact upload retry::Attempt 1/3 failed; retrying in 5 seconds.'
        sleep 5

    - name: Upload artifact (attempt 2/3)
      id: upload_2
      if: ${{ !cancelled() && steps.upload_1.outcome == 'failure' }}
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        # A failed finalize response is ambiguous: delete any partial or
        # already-finalized generation before publishing the retry.
        overwrite: true

    - name: Report artifact upload recovery on attempt 2/3
      if: ${{ !cancelled() && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      run: echo '::notice title=Artifact upload recovered::Artifact publication succeeded on attempt 2/3.'

    - name: Back off before artifact upload retry 2
      if: ${{ !cancelled() && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure' }}
      continue-on-error: true
      shell: bash
      run: |
        echo '::warning title=Artifact upload retry::Attempt 2/3 failed; retrying in 15 seconds.'
        sleep 15

    - name: Upload artifact (attempt 3/3)
      if: ${{ !cancelled() && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure' }}
      id: upload_3
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        retention-days: ${{ inputs.retention-days }}
        compression-level: ${{ inputs.compression-level }}
        overwrite: true

    - name: Report artifact upload recovery on attempt 3/3
      if: ${{ !cancelled() && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure' && steps.upload_3.outcome == 'success' }}
      continue-on-error: true
      shell: bash
      run: echo '::notice title=Artifact upload recovered::Artifact publication succeeded on attempt 3/3.'

    - name: Fail after exhausting artifact upload attempts
      if: ${{ !cancelled() && steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure' && steps.upload_3.outcome == 'failure' }}
      shell: bash
      run: |
        echo '::error title=Artifact upload failed::All 3 attempts failed. See the preceding upload steps for the root error.'
        exit 1
