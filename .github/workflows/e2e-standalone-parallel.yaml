name: MatrixOne e2e CI(Standalone)

on:
  workflow_call:
    inputs:
      bvt_group:
        description: "BVT group assigned by the caller (0 or 1)"
        required: false
        type: string
        default: ""
      bvt_generation:
        description: "Shared assignment generation for complementary BVT jobs"
        required: false
        type: string
        default: ""
      tenant_parallel_enabled:
        description: "Run directory-safe BVT cases in tenant workers"
        required: false
        type: boolean
        default: false
      ci_ref:
        description: "matrixorigin/CI ref containing tenant BVT scripts"
        required: false
        type: string
        default: "main"
    secrets:
      TOKEN_ACTION:
        description: "Token for checkout (e.g. pull from fork/private)"
        required: false

jobs:
  bvt-linux-x86:
    if: false
    environment: ci
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    name: e2e BVT Test on Linux/x64(LAUNCH,Optimistic)
    timeout-minutes: 90
    steps:
      - name: checkout head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          fetch-depth: "3"
          path: ./head
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go And Java
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          go-version-file: "${{ github.workspace }}/head/go.mod"
      - name: Build MatrixOne
        run: |
          cd $GITHUB_WORKSPACE/head && make clean && make build
          git rev-parse --short HEAD
      - name: echo config
        run: |
          cd $GITHUB_WORKSPACE/head
          echo ""  >> ./etc/launch/cn.toml
          echo '[cn.txn]' >> ./etc/launch/cn.toml
          echo 'mode = "Optimistic"' >> ./etc/launch/cn.toml
          echo "  enable-leak-check = 1" >> ./etc/launch/cn.toml
          echo '  max-active-ages = "2m"'>> ./etc/launch/cn.toml
          echo ""  >> ./etc/launch/tn.toml
          echo '[tn.txn]' >> ./etc/launch/tn.toml
          echo 'mode = "Optimistic"' >> ./etc/launch/tn.toml
          cat ./etc/launch/cn.toml
          cat ./etc/launch/tn.toml
      - name: Start MO
        run: |
          cd $GITHUB_WORKSPACE/head
          ./optools/run_bvt.sh $GITHUB_WORKSPACE/head launch
      - name: Clone test-tool repository
        uses: actions/checkout@v6
        with:
          repository: matrixorigin/mo-tester
          path: ./mo-tester
          ref: main
      - name: Update BVT SQL Timeout
        run: |
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i "s/socketTimeout:.*/socketTimeout: 300000/g" mo.yml
      - name: Start BVT Test
        id: bvt_on_pr_version
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          ./run.sh -n -g -o -p $GITHUB_WORKSPACE/head/test/distributed/cases -e pessimistic_transaction 2>&1
      - name: Dump mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          max_retry=5
          retry=0
          while [ "$(ps -ef | grep 'mo-service' | grep -v "grep" | wc -l)" -gt 0 ]; do
            curl http://localhost:12345/debug/pprof/goroutine\?debug=2 -o ${{ github.workspace }}/head/dump-stacks${retry}.log
            pkill -9 mo-service
            retry=$((retry+1))
            if [ ${retry} -ge ${max_retry} ]; then
              echo 'after retry, still cannot shutdown mo-service'
              exit 1
            fi
            sleep 2
          done
      - name: Restart the Version of Head of MO
        run: |
          cd $GITHUB_WORKSPACE/head
          mv mo-service.log mo-service.r1.log

          # delete for clear the start finish status of mo
          rm -rf mo-data/local/system_init_completed

          ./optools/run_bvt.sh $GITHUB_WORKSPACE/head launch
      - name: Start BVT Test for MO with Version of Head Restarted
        id: bvt_on_latest_head_version_run2
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          ./run.sh -n -g -o -p $GITHUB_WORKSPACE/head/test/distributed/cases -e pessimistic_transaction 2>&1
      - name: Dump restarted mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          if [ "$(ps -ef | grep 'mo-service' | grep -v "grep" | wc -l)" -gt 0 ]; then curl http://localhost:12345/debug/pprof/goroutine\?debug=2 -o ${{ github.workspace }}/head/restarted-dump-stacks.log; pkill -9 mo-service; else echo 'current mo-service has already crashed'; exit 1; fi
      - name: Check Log Messages Count per second
        if: ${{ always() && !cancelled() }}
        run: |
          cd $GITHUB_WORKSPACE/head
          # 4 nodes in one Process
          ./optools/check_log_count.sh 4000 60 # {count threshold} {metric collected interval}
      - name: generate upload files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set +e
          mkdir -p ${{ github.workspace }}/upload
          rm -rf ./mo-tester/.git
          rm -rf ./mo-tester/lib
          mv ${{ github.workspace }}/head/mo-service.r1.log ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/head/mo-service.log ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/mo-tester ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/head/dump-stacks* ${{ github.workspace }}/upload/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled()}}
        continue-on-error: true
        with:
          name: Standalone-e2e-BVT-Test-on-Linux-x64(LAUNCH,Optimistic)-reports
          path: |
            ${{ github.workspace }}/upload
          retention-days: 7
      - uses: actions/upload-artifact@v7
        name: Upload MO DATA
        if: ${{ failure() }}
        continue-on-error: true
        with:
          name: Standalone-e2e-BVT-Test-on-Linux-x64(LAUNCH,Optimistic)-mo-data
          path: |
            ${{ github.workspace }}/head/mo-data
          retention-days: 7

  multi-cn-proxy-bvt-linux-x86:
    # Compose + Proxy is the active proxy coverage deployment. Keep the
    # native proxy launcher out of the PR matrix until it has a distinct role.
    if: false
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    name: Legacy Launch + Proxy BVT (disabled in parallel workflow)
    timeout-minutes: 75
    env:
      mo_reuse_enable_checker: true
    steps:
      - name: checkout head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION }}
          path: ./head
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Go And Java
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          go-version-file: "${{ github.workspace }}/head/go.mod"
      - name: Build MatrixOne
        run: |
          cd $GITHUB_WORKSPACE/head && make clean && make build
          git rev-parse --short HEAD
      - name: Prepare Hosts
        run: |
          sudo bash -c 'echo -e "127.0.0.1\tcn0" >> /etc/hosts;';
          sudo bash -c 'echo -e "127.0.0.1\tcn1" >> /etc/hosts;';
      - name: Add cn.txn
        run: |
          cd $GITHUB_WORKSPACE/head
          echo "" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo "" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo "[cn.txn]" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo "  enable-leak-check = 1" >> ./etc/launch-dynamic-with-proxy/cn.toml.base
          echo '  max-active-ages = "2m"'>> ./etc/launch-dynamic-with-proxy/cn.toml.base
      - name: Start MO
        run: |
          sudo cat /etc/hosts | grep '127.0.0.1';
          cd $GITHUB_WORKSPACE/head
          ./optools/run_bvt.sh $GITHUB_WORKSPACE/head launch-dynamic-with-proxy -with-proxy
      - name: Clone test-tool repository
        uses: actions/checkout@v6
        with:
          repository: matrixorigin/mo-tester
          path: ./mo-tester
          ref: main
      - name: Update BVT SQL Timeout
        run: |
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i "s/socketTimeout:.*/socketTimeout: 300000/g" mo.yml
      - name: Start BVT Test
        id: bvt_on_pr_version
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          ./run.sh -n -g -o -p $GITHUB_WORKSPACE/head/test/distributed/cases -e optimistic 2>&1
      - name: Dump mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          if [ "$(ps -ef | grep 'mo-service' | grep -v "grep" | wc -l)" -gt 0 ]; then curl http://localhost:12345/debug/pprof/goroutine\?debug=2 -o ${{ github.workspace }}/head/dump-stacks.log; else echo 'current mo-service has already crashed'; exit 1; fi
      - name: Check Log Messages Count per second
        if: ${{ always() && !cancelled() }}
        run: |
          cd $GITHUB_WORKSPACE/head
          # one node in one Process
          ./optools/check_log_count.sh 1000 60 # {count threshold} {metric collected interval}
      - name: generate upload files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/upload
          rm -rf ./mo-tester/.git
          rm -rf ./mo-tester/lib
          mv ${{ github.workspace }}/head/mo-service.log ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/mo-tester ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/head/dump-stacks.log ${{ github.workspace }}/upload/
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled()}}
        continue-on-error: true
        with:
          name: Standalone-Multi-CN-e2e-BVT-Test-on-Linux-x64(LAUNCH,PROXY)-reports
          path: |
            ${{ github.workspace }}/upload
          retention-days: 7

  pessimistic-bvt-linux-x86:
    # Match the existing PR BVT runner policy.
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-22.04' }}
    name: e2e BVT Test on Linux/x64(LAUNCH, PESSIMISTIC)
    timeout-minutes: 75
    env:
      mo_reuse_enable_checker: true
    steps:
      - name: checkout head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          token: ${{ secrets.TOKEN_ACTION || github.token }}
          fetch-depth: "3"
          path: ./head
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Go And Java
        uses: matrixorigin/CI/actions/setup-env@main
        with:
          go-version-file: "${{ github.workspace }}/head/go.mod"

      - name: Build MatrixOne
        run: |
          cd "$GITHUB_WORKSPACE/head"
          make clean && make GOBUILD_OPT=-cover build
          git rev-parse --short HEAD

      - name: Add cn.txn
        run: |
          cd $GITHUB_WORKSPACE/head
          echo "[cn.txn]" >> ./etc/launch/cn.toml
          echo "  enable-leak-check = 1" >> ./etc/launch/cn.toml
          echo '  max-active-ages = "2m"'>> ./etc/launch/cn.toml

      - name: echo config
        run: |
          cd $GITHUB_WORKSPACE/head
          cat ./etc/launch/cn.toml
          cat ./etc/launch/tn.toml

      - name: Start MO
        run: |
          cd $GITHUB_WORKSPACE/head
          export GOCOVERDIR="${RUNNER_TEMP}/bvt-coverage-pessimistic"
          rm -rf "${GOCOVERDIR}"
          mkdir -p "${GOCOVERDIR}"
          ./optools/run_bvt.sh $GITHUB_WORKSPACE/head launch

      - name: Clone test-tool repository
        uses: actions/checkout@v6
        with:
          repository: matrixorigin/mo-tester
          path: ./mo-tester
          ref: main
      - name: Checkout tenant-parallel BVT scripts
        if: ${{ inputs.tenant_parallel_enabled }}
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: matrixorigin/CI
          ref: ${{ inputs.ci_ref }}
          path: .ci/tenant-parallel
      - name: Update BVT SQL Timeout
        run: |
          cd $GITHUB_WORKSPACE/mo-tester
          sed -i "s/socketTimeout:.*/socketTimeout: 300000/g" mo.yml
      - name: Start BVT Test
        id: bvt_on_pr_version
        run: |
          export LC_ALL="C.UTF-8"
          locale
          cd "$GITHUB_WORKSPACE/mo-tester"
          sed -i 's/  port: [0-9]*/  port: 12345/g' mo.yml
          cat mo.yml
          echo "============================="

          bvt_group='${{ inputs.bvt_group }}'
          bvt_generation='${{ inputs.bvt_generation }}'
          if [ -z "${bvt_group}" ]; then
            bvt_group=$(( 1 - ((${{ github.run_id }} + ${{ github.run_attempt }}) % 2) ))
          fi
          if [ -z "${bvt_generation}" ]; then
            bvt_generation='${{ github.run_id }}-${{ github.run_attempt }}'
          fi
          if [[ ! "${bvt_group}" =~ ^[01]$ ]] || [ -z "${bvt_generation}" ]; then
            echo "::error::invalid BVT assignment: group=${bvt_group}, generation=${bvt_generation}"
            exit 1
          fi
          echo "bvt_group=${bvt_group}" >> "$GITHUB_OUTPUT"
          echo "bvt_generation=${bvt_generation}" >> "$GITHUB_OUTPUT"
          jq -n \
            --arg deployment 'launch-pessimistic' \
            --argjson group "${bvt_group}" \
            --arg generation "${bvt_generation}" \
            --arg head_sha '${{ github.event.pull_request.head.sha }}' \
            '{schema_version: 1, deployment: $deployment, group: $group, generation: $generation, head_sha: $head_sha}' \
            > "${RUNNER_TEMP}/bvt-pessimistic-manifest.json"
          echo "Launch + Pessimistic BVT: generation ${bvt_generation}, group ${bvt_group}"
          {
            echo "### BVT group assignment"
            echo "- Deployment: native launch (PESSIMISTIC)"
            echo "- Group: ${bvt_group}"
            echo "- Generation: ${bvt_generation}"
          } >> "$GITHUB_STEP_SUMMARY"
          cd "$GITHUB_WORKSPACE/head"
          set -o pipefail
          bvt_runner="$GITHUB_WORKSPACE/head/optools/run_bvt_group.sh"
          if [ ! -f "${bvt_runner}" ]; then
            bvt_runner="${RUNNER_TEMP}/run_bvt_group.sh"
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/matrixorigin/matrixone/7cb78aa5f88e3b98163f6b3bffb5f71586c0cbbf/optools/run_bvt_group.sh" \
              --output "${bvt_runner}"
          fi
          if [ '${{ inputs.tenant_parallel_enabled }}' = 'true' ]; then
            bash "$GITHUB_WORKSPACE/.ci/tenant-parallel/scripts/run_bvt_tenant_parallel.sh" \
              --tester-dir "$GITHUB_WORKSPACE/mo-tester" \
              --case-root "$GITHUB_WORKSPACE/head/test/distributed/cases" \
              --group "${bvt_group}" \
              --directories "$GITHUB_WORKSPACE/.ci/tenant-parallel/scripts/bvt_tenant_directories.sh" \
              --output-dir "${RUNNER_TEMP}/bvt-tenant-pessimistic" \
              --resource-dir "$GITHUB_WORKSPACE/head/test/distributed/resources"
          else
            bash "${bvt_runner}" \
              "$GITHUB_WORKSPACE/mo-tester" \
              "$GITHUB_WORKSPACE/head/test/distributed/cases" \
              "${bvt_group}" \
              "$GITHUB_WORKSPACE/head/test/distributed/resources"
          fi 2>&1 | tee "${RUNNER_TEMP}/bvt-pessimistic.log"

      - name: Summarize Launch + Pessimistic BVT result
        if: ${{ always() && !cancelled() }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/bvt-pessimistic.log"
          timing="${RUNNER_TEMP}/bvt-pessimistic-slowest.tsv"
          if [ ! -s "${report}" ]; then
            echo '### Launch + Pessimistic BVT result' | tee -a "$GITHUB_STEP_SUMMARY"
            echo '- No BVT execution log was produced.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### Launch + Pessimistic BVT result'
            grep -E '^(Run BVT group|BVT directory plan:)' "${report}" | sed 's/^/- /' || true
            echo
            echo '#### Top 10 slow BVT scripts'
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

          tenant_summary="${RUNNER_TEMP}/bvt-tenant-pessimistic/summary.tsv"
          if [ -s "${tenant_summary}" ]; then
            {
              echo '#### Tenant BVT phase results'
              echo
              echo '```text'
              cat "${tenant_summary}"
              echo '```'
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          sed -nE 's#.*script file\[(.*)\] has been executed, and cost: ([0-9.]+)s.*#\2s\t\1#p' "${report}" \
            | sort -nr -k1,1 | awk 'NR <= 10 { print }' > "${timing}"
          if [ ! -s "${timing}" ]; then
            echo 'No per-script timing records found in BVT output.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '```text'
            cat "${timing}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Launch + Pessimistic BVT execution log
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bvt-execution-pessimistic
          path: |
            ${{ runner.temp }}/bvt-pessimistic.log
            ${{ runner.temp }}/bvt-tenant-pessimistic
          if-no-files-found: warn
          retention-days: 7

      - name: Dump mo-service goroutines
        if: ${{ always() && !cancelled() }}
        run: |
          if [ "$(ps -ef | grep 'mo-service' | grep -v "grep" | wc -l)" -gt 0 ]; then curl http://localhost:12345/debug/pprof/goroutine\?debug=2 -o ${{ github.workspace }}/head/dump-stacks.log; else echo 'current mo-service has already crashed'; exit 1; fi

      - name: Check Log Messages Count per second
        if: ${{ always() && !cancelled() }}
        run: |
          cd $GITHUB_WORKSPACE/head
          # 4 nodes in one Process
          ./optools/check_log_count.sh 4000 60 # {count threshold} {metric collected interval}

      - name: Stop service and generate BVT coverage profile
        if: ${{ always() && !cancelled() }}
        run: |
          set -uo pipefail
          coverage_dir="${RUNNER_TEMP}/bvt-coverage-pessimistic"
          coverage_profile="${RUNNER_TEMP}/bvt-pessimistic.out"
          pids=$(pgrep -f 'mo-service' || true)
          if [ -n "${pids}" ]; then
            kill -TERM ${pids} || true
          fi
          for _ in $(seq 1 30); do
            pgrep -f 'mo-service' >/dev/null || break
            sleep 1
          done
          pids=$(pgrep -f 'mo-service' || true)
          if [ -n "${pids}" ]; then
            kill -KILL ${pids} || true
          fi
          if go tool covdata textfmt -i="${coverage_dir}" -o "${coverage_profile}"; then
            test -s "${coverage_profile}"
          elif [ "${{ steps.bvt_on_pr_version.conclusion }}" = "success" ]; then
            echo '::error::failed to generate Launch + Pessimistic BVT coverage after a successful BVT'
            exit 1
          else
            echo '::warning::Launch + Pessimistic BVT coverage unavailable because BVT did not finish successfully'
          fi

      - name: Upload Launch + Pessimistic BVT coverage
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bvt-coverage-pessimistic-generation-${{ steps.bvt_on_pr_version.outputs.bvt_generation || format('{0}-{1}', github.run_id, github.run_attempt) }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/bvt-pessimistic.out
            ${{ runner.temp }}/bvt-pessimistic-manifest.json
          if-no-files-found: warn
          retention-days: 7

      - name: generate upload files
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p ${{ github.workspace }}/upload
          rm -rf ./mo-tester/.git
          rm -rf ./mo-tester/lib
          mv ${{ github.workspace }}/head/mo-service.log ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/mo-tester ${{ github.workspace }}/upload/
          mv ${{ github.workspace }}/head/dump-stacks.log ${{ github.workspace }}/upload/

      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled()}}
        continue-on-error: true
        with:
          name: Standalone-e2e-BVT-Test-on-Linux-x64(LAUNCH,PESSIMISTIC)-reports
          path: |
            ${{ github.workspace }}/upload
          retention-days: 7
